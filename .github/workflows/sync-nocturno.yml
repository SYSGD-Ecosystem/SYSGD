name: Sincronización Nocturna Inteligente

on:
  schedule:
    - cron: '0 1 * * *' # 01:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config --global user.name "SYSGD Bot"
          git config --global user.email "actions@github.com"

      - name: Sincronizar dev-master -> dev-deploy
        run: |
          set -e

          echo "🔄 Obteniendo ramas..."
          git fetch origin

          # Crear o cambiar a dev-deploy
          if git show-ref --verify --quiet refs/heads/dev-deploy; then
            git checkout dev-deploy
          else
            git checkout -b dev-deploy origin/dev-deploy || git checkout -b dev-deploy
          fi

          echo "📊 Verificando cambios..."
          if git diff --quiet origin/dev-deploy origin/dev-master; then
            echo "✅ No hay cambios nuevos. Nada que hacer."
            exit 0
          fi

          echo "🚀 Aplicando cambios desde dev-master..."
          git merge origin/dev-master --no-edit

          echo "📤 Subiendo cambios..."
          git push origin dev-deploy

          echo "✅ Sincronización completada"